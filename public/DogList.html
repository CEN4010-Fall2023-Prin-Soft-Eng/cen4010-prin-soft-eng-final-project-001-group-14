  /* CSS for the search box */
  .search-box {
    position: relative;
    margin-top: 20px;
  }

  .search-box input[type="search"] {
    background: transparent;
    border: 2px solid #000000;
    /*border-bottom: 5px solid #000000;*/
    color: #ffffff;
    width: 0;
    padding: 10px;
    transition: width 0.4s ease-in-out;
    margin-right: 10px;
  }

  .search-box input[type="search"]::placeholder {
    color: #fff; 
  }

  .search-box input[type="search"]:focus {
    width: 200px; /* Adjust width as needed */
    outline: none;
  }

  .search-box .btn {
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    transition: color 0.4s ease-in-out;
  }

  .search-box .btn:hover {
    color: #000000;
  }
</style>

    body {

      color: #fff; /* Set the text color to white */
      text-align: center; /* Center align the text */
      height: 100vh;
      margin: 0;
    }
    .dropbtn {
      background-color: #4CAF50;
      color: white;
      padding: 16px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }
    
    /* The container <div> - needed to position the dropdown content */
    .dropdown {
      position: relative;
      display: inline-block;
    }
    
    /* Dropdown Content (Hidden by Default) */
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #f9f9f9;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
    }
    
    /* Links inside the dropdown */
    .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
    }
    
    /* Change color of dropdown links on hover */
    .dropdown-content a:hover {background-color: #f1f1f1}
    
    /* Show the dropdown menu on hover */
    .dropdown:hover .dropdown-content {
      display: block;
    }
    
    /* Change the background color of the dropdown button when the dropdown content is shown */
    .dropdown:hover .dropbtn {
      background-color: #3e8e41;
   
    }
  </style>
</head>

        <!-- Display dog details in cards -->

            <!-- Cards will be dynamically added here -->
        </div>

    <script>
        // Simulated dog data - Replace this with your API call or data retrieval logic
        const dogData = {
            "Dog 1": { name: "Dog 1", breed: "Breed 1", age: "3 years", description: "Description of Dog 1" },
            "Dog 2": { name: "Dog 2", breed: "Breed 2", age: "2 years", description: "Description of Dog 2" },
            "Dog 3": { name: "Dog 3", breed: "Breed 3", age: "4 years", description: "Description of Dog 3" }
            // Add more dogs or retrieve from an API
        };

        // Function to create dog cards
        function createDogCard(dog) {
            const card = document.createElement('div');
            card.classList.add('dog-card');

            const cardContent = `
                <h2>${dog.name}</h2>
                <p>Breed: ${dog.breed}</p>
                <p>Age: ${dog.age}</p>
                <p>Description: ${dog.description}</p>
            `;

            card.innerHTML = cardContent;
            return card;
        }

        // Function to display dog details in cards based on Dog_ID
        function displayDogDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const dogId = urlParams.get('dogID');

            const dogContainer = document.querySelector('.dog-cards-container');

            if (dogData[dogId]) {
                const dogCard = createDogCard(dogData[dogId]);
                dogContainer.appendChild(dogCard);
            } else {
                const errorCard = document.createElement('div');
                errorCard.textContent = 'Dog not found';
                dogContainer.appendChild(errorCard);
            }
        }

        // Call the function to display dog details when the page loads
        displayDogDetails();
    </script>
