  <script>
    $(document).ready(function () {
      // Define an array to store favorited dog data
      var favoritedDogs = [];
    
      // Function to handle adding a dog to favorites
      function addToFavorites(dogData) {
        // Check if the dogData is not already in the favoritedDogs array
        if (!isDogInFavorites(dogData.id)) {
          // Add the dogData to the array
          favoritedDogs.push(dogData);
    
          // Save the updated favoritedDogs array to localStorage
          saveToLocalStorage();
    
          // Update the favorited dogs dropdown
          updateFavoritedDogsDropdown();
        }
      }
    
      // Function to check if a dog with a specific ID is already in favorites
      function isDogInFavorites(dogId) {
        return favoritedDogs.some(function (dog) {
          return dog.id === dogId;
        });
      }
    
      // Function to remove a dog from favorites
      function removeFromFavorites(dogId) {
        // Filter out the dog with the specified ID
        favoritedDogs = favoritedDogs.filter(function (dog) {
          return dog.id !== dogId;
        });
      
        // Save the updated favoritedDogs array to localStorage
        saveToLocalStorage();
    
        // Update the favorited dogs dropdown
        updateFavoritedDogsDropdown();
      }
    
      // Function to update the favorited dogs dropdown
      function updateFavoritedDogsDropdown() {
        var dropdown = $('#favoritedDogs');
    
        // Remove previous event listener to avoid multiple bindings
        dropdown.off('change');
    
         // Clear the dropdown before updating
        dropdown.empty();

        // Add a default option
        dropdown.append('<option value="" disabled selected>Select a dog</option>');
    
        // Populate the dropdown with favorited dog data
        favoritedDogs.forEach(function (dog) {
          dropdown.append('<option value="' + dog.id + '">' + dog.name + '</option>');
        });
    
        // Add event listener to navigate to the selected dog's webpage in a new tab
        dropdown.on('change', function () {
          var selectedDog = favoritedDogs.find(function (dog) {
            return dog.id == dropdown.val();
          });
    
          if (selectedDog) {
            window.open(selectedDog.webpage, '_blank');
          }
        });
      }
    
      // Function to save the favoritedDogs array to localStorage
      function saveToLocalStorage() {
        localStorage.setItem('favoritedDogs', JSON.stringify(favoritedDogs));
      }
    
      // Function to load the favoritedDogs array from localStorage
      function loadFromLocalStorage() {
        var storedData = localStorage.getItem('favoritedDogs');
        if (storedData) {
          favoritedDogs = JSON.parse(storedData);
          updateFavoritedDogsDropdown();
        }
      }
    
      // Load favorited dogs from localStorage when the page loads
      loadFromLocalStorage();
    
      $('#pet-form').submit(function (e) {
        e.preventDefault();
    
        var animal = $('#animal').val();
        var zip = $('#zip').val();
        var radius = $('#radius').val();
        var set = parseInt($('#set').val(), 10) || undefined;
    
        // Additional parameters (optional)
        var breed = $('#breed').val();
        var sex = $('#sex').val();
        var age = $('#age').val();
        var size = $('#size').val();
        var color = $('#color').val();
    
        // Make an API request using Axios
        axios.get('/dogs', {
          params: {
            animal: animal,
            zip_code: zip,
            radius: radius,
            set: set,
            breed: breed,
            sex: sex,
            age: age,
            size: size,
            color: color
          }
        })
          .then(function (response) {
            // Clear previous results
            $('#results').empty();
    
            // Display each dog in a neat format
            response.data.forEach(function (dog) {
              var dogCard = `
              <div class="swiper-slide">
                <div class="card mt-3">
                  <img src="${dog.photoURL}" class="card-img-top" alt="${dog.name}">
                  <div class="card-body">
                    <h5 class="card-title">${dog.name}</h5>
                    <p class="card-text">ID: ${dog.id}</p>
                    <p class="card-text">Breed: ${dog.breed.primary}${dog.breed.secondary ? `/${dog.breed.secondary}` : ''}</p>
                    <p class="card-text">Age: ${dog.age}</p>
                    <p class="card-text">Sex: ${dog.sex}</p>
                    <p class="card-text overflow-hidden" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;">Description: ${dog.description}</p>
                    <a href="${dog.webpage}" class="btn btn-primary" target="_blank">Learn More</a>
                    <!-- Add Favorite button with a click event handler -->
                    <button class="btn btn-outline-danger btn-favorite" data-dog-id="${dog.id}">Favorite</button>
                  </div>
                </div>
              </div>
              `;
    
              $('#results').append(dogCard);
            });
    
            // Initialize Swiper
            var swiper = new Swiper('.swiper-container', {
              slidesPerView: 1,
              spaceBetween: 10,
              navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
              },
            });
    
            // Add click event handler for Favorite buttons
            $('.btn-favorite').click(function () {
              var dogId = $(this).data('dog-id');
              var dogData = response.data.find(function (dog) {
                return dog.id === dogId;
              });
              addToFavorites(dogData);
            });
          })
          .catch(function (error) {
            console.error('Error fetching data:', error)
          });
      });
    });
    
  </script>
