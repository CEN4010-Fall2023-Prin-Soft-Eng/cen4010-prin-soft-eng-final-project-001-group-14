<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Find A Dog</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css"
      integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700|Poppins:400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/bootstrap.css">
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/responsive.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <link href="css/FindADog.css" rel="stylesheet">
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
      integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
      crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/script.js"></script>
    <script>
      $(document).ready(function () {
        // Define an array to store favorited dog data
        var favoritedDogs = [];
    
        // Counter to keep track of the current dog card index
        var currentDogIndex = 0;
    
        // Function to handle adding a dog to favorites
        function addToFavorites(dogData) {
          // Check if the dogData is not already in the favoritedDogs array
          if (!isDogInFavorites(dogData.id)) {
            // Add the dogData to the array
            favoritedDogs.push(dogData);
    
            // Save the updated favoritedDogs array to localStorage
            saveToLocalStorage();
    
            // Update the favorited dogs dropdown
            updateFavoritedDogsDropdown();
          }
        }
    
        // Function to check if a dog with a specific ID is already in favorites
        function isDogInFavorites(dogId) {
          return favoritedDogs.some(function (dog) {
            return dog.id === dogId;
          });
        }
    
        // Function to remove a dog from favorites
        function removeFromFavorites(dogId) {
          // Filter out the dog with the specified ID
          favoritedDogs = favoritedDogs.filter(function (dog) {
            return dog.id !== dogId;
          });
    
          // Save the updated favoritedDogs array to localStorage
          saveToLocalStorage();
    
          // Update the favorited dogs dropdown
          updateFavoritedDogsDropdown();
        }
    
        // Function to update the favorited dogs dropdown
        function updateFavoritedDogsDropdown() {
          var dropdown = $('#favoritedDogs');
    
          // Remove previous event listener to avoid multiple bindings
          dropdown.off('change');
    
          // Clear the dropdown before updating
          dropdown.empty();
    
          // Add a default option
          dropdown.append('<option value="" disabled selected>Select a dog</option>');
    
          // Populate the dropdown with favorited dog data
          favoritedDogs.forEach(function (dog) {
            dropdown.append('<option value="' + dog.id + '">' + dog.name + '</option>');
          });
    
          // Add event listener to navigate to the selected dog's webpage in a new tab
          dropdown.on('change', function () {
            var selectedDog = favoritedDogs.find(function (dog) {
              return dog.id == dropdown.val();
            });
    
            if (selectedDog) {
              window.open(selectedDog.webpage, '_blank');
            }
          });
        }
    
        // Function to save the favoritedDogs array to localStorage
        function saveToLocalStorage() {
          localStorage.setItem('favoritedDogs', JSON.stringify(favoritedDogs));
        }
    
        // Function to load the favoritedDogs array from localStorage
        function loadFromLocalStorage() {
          var storedData = localStorage.getItem('favoritedDogs');
          if (storedData) {
            favoritedDogs = JSON.parse(storedData);
            updateFavoritedDogsDropdown();
          }
        }
    
        // Load favorited dogs from localStorage when the page loads
        loadFromLocalStorage();
    
        $('#pet-form').submit(function (e) {
          e.preventDefault();
    
          // Reset the current dog index to 0 when a new search is performed
          currentDogIndex = 0;
    
          var animal = $('#animal').val();
          var zip = $('#zip').val();
          var radius = $('#radius').val();
          var set = parseInt($('#set').val(), 10) || undefined;
    
          // Additional parameters (optional)
          var breed = $('#breed').val();
          var sex = $('#sex').val();
          var age = $('#age').val();
          var size = $('#size').val();
          var color = $('#color').val();
    
          // Make an API request using Axios
          axios.get('/dogs', {
            params: {
              animal: animal,
              zip_code: zip,
              radius: radius,
              set: set,
              breed: breed,
              sex: sex,
              age: age,
              size: size,
              color: color
            }
          })
            .then(function (response) {
              // Clear previous results
              $('#results').empty();
    
              // Display each dog in a neat format
              response.data.forEach(function (dog) {
                var dogCard = `
                  <div class="swiper-slide">
                    <div class="card mt-3">
                      <img src="${dog.photoURL}" class="card-img-top" alt="${dog.name}">
                      <div class="card-body">
                        <h5 class="card-title">${dog.name}</h5>
                        <p class="card-text">ID: ${dog.id}</p>
                        <p class="card-text">Breed: ${dog.breed.primary}${dog.breed.secondary ? `/${dog.breed.secondary}` : ''}</p>
                        <p class="card-text">Age: ${dog.age}</p>
                        <p class="card-text">Sex: ${dog.sex}</p>
                        <p class="card-text overflow-hidden" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;">Description: ${dog.description}</p>
                        <a href="${dog.webpage}" class="btn btn-primary" target="_blank">Learn More</a>
                        <!-- Add Favorite button with a click event handler -->
                        <button class="btn btn-outline-danger btn-favorite" data-dog-id="${dog.id}">Favorite</button>
                      </div>
                    </div>
                  </div>
                `;
    
                $('#results').append(dogCard);
              });
    
              // Initialize Swiper
              var swiper = new Swiper('.swiper-container', {
                slidesPerView: 1,
                spaceBetween: 10,
                navigation: {
                  nextEl: '.swiper-button-next',
                  prevEl: '.swiper-button-prev',
                },
                initialSlide: currentDogIndex, // Set the initial slide index
              });
    
              // Reset Swiper to the first card
              swiper.slideTo(currentDogIndex, 0);
    
              // Add click event handler for Favorite buttons
              $('.btn-favorite').click(function () {
                var dogId = $(this).data('dog-id');
                var dogData = response.data.find(function (dog) {
                  return dog.id === dogId;
                });
                addToFavorites(dogData);
              });
    
              if (response.data.length === 0) {
                $('#results').append('<p>No dogs found.</p>');
              }
            })
    
            .catch(function (error) {
              console.error('Error fetching data:', error)
            });
        });
      });
    </script>
  </head>
  <body>
    <div class="hero_area">
      <div class="hero_bg_box">
        <div class="img-box">
          <img src="images/Dog2.png" alt="">

      </div>
      <header class="header_section">
        <div class="header_top">
          <div class="container-fluid">
            <div class="contact_link-container">
              <a href="" class="contact_link1">
                <i class="fa fa-map-marker" aria-hidden="true"></i>
                <span>
                  Find Your Dog
                </span>
              </a>
              <a href="" class="contact_link2">
                <span>
                </span>
              </a>
              <a href="" class="contact_link3">
                <span>
                </span>
              </a>
            </div>
          </div>
        </div>
        <div class="header_bottom">
          <div class="container-fluid">
            <nav class="navbar navbar-expand-lg custom_nav-container">
              <a class="navbar-brand" href="index.html">
                <span>
                  Find-A-Dog
                </span>
              </a>
              <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class=""></span>
              </button>
              <div class="collapse navbar-collapse ml-auto" id="navbarSupportedContent">
                <ul class="navbar-nav  ">
                  <li class="nav-item">
                    <a class="nav-link" href="login.html">Login</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="index.html">Home <span class="sr-only">(current)</span></a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="about.html"> About</a>

                  <li class="nav-item active">
                    <a class="nav-link" href="FindADog.html"> Find Your Dog </a>
                  </li>
                </ul>
              </div>
            </nav>
          </div>
        </div>
      </header>
      <div class="container">
        <form id="pet-form" action="/dogs" method="GET">
          <div class="form-group">
            <label for="animal">Animal</label>
            <select id="animal" class="form-control form-control-lg mb-3">
              <option value="dog">Dog</option>
            </select>
            <input type="text" id="zip" name="zip_code" class="form-control form-control-lg" placeholder="Enter your zipcode">
            <input type="text" id="radius" name="radius" class="form-control form-control-lg" placeholder="Enter radius ">
            <input type="number" id="set" name="set" class="form-control form-control-lg" placeholder="Enter set">
            <!-- Drop-down menu for breed -->
            <label for="breed">Breed</label>
            <select id="breed" class="form-control form-control-lg">
              <option value="">Any</option>
              <option value="American Bulldog">American Bulldog</option>
              <option value="American Staffordshire Terrier">American Staffordshire Terrier</option>
              <option value="Labrador Retriever">Labrador Retriever</option>
              <option value="Shepherd">Shepherd</option>
              <option value="Black Labrador Retriever">Black Labrador Retriever</option>
              <option value="Mixed Breed">Mixed Breed</option>
              <option value="Chihuahua">Chihuahua</option>
              <option value="German Shepherd Dog">German Shepherd Dog</option>
              <option value="Hound">Hound</option>
              <option value="Pit Bull Terrier">Pit Bull Terrier</option>
              <option value="Belgian Shepherd / Malinois">Belgian Shepherd / Malinois</option>
            </select>
            <!-- Drop-down menu for sex -->
            <label for="sex">Sex</label>
            <select id="sex" class="form-control form-control-lg">
              <option value="">Any</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
            <!-- Drop-down menu for age -->
            <label for="age">Age</label>
            <select id="age" class="form-control form-control-lg">
              <option value="">Any</option>
              <option value="Baby">Baby</option>
              <option value="Young">Young</option>
              <option value="Adult">Adult</option>
              <option value="Senior">Senior</option>
            </select>
            <!-- Additional input fields for optional parameters -->
            <label for="size">Size</label>
            <select id="size" class="form-control form-control-lg">
              <option value="">Any</option>
              <option value="Small">Small</option>
              <option value="Medium">Medium</option>
              <option value="Large">Large</option>
              <option value="Extra Large">Extra Large</option>
            </select>
            <label for="color">Color</label>
            <select id="color" class="form-control form-control-lg">
              <option value="">Any</option>
              <option value="Apricot / Beige">Apricot / Beige</option>
              <option value="Bicolor">Bicolor</option>
              <option value="Black">Black</option>
              <option value="Brown / Chocolate">Brown / Chocolate</option>
              <option value="Gray / Blue / Silver">Gray / Blue / Silver</option>
              <option value="White / Cream">White / Cream</option>
              <option value="Red / Chestnut / Orange">Red / Chestnut / Orange</option>
            </select>
            <!-- End of additional input fields -->
            <input type="submit" value="Find" class="btn btn-dark btn-lg btn-block mt-3">
            <div class="favorited-dogs">
              <label for="favoritedDogs">Favorited Dogs:</label>
              <select id="favoritedDogs" class="form-control">
                <!-- The favorited dogs' IDs will be dynamically added here -->
              </select>
            </div>
          </div>
        </form>
        <!-- Swiper container -->
        <div class="swiper-container">
          <div class="swiper-wrapper" id="results"></div>
          <!-- Add navigation buttons -->
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
        </div>
        <!-- End Swiper container -->
      </div>
      <!-- End form section -->
    </div>
  </body>
